[supervisord]
nodaemon=true
user=trading
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# Streamlit 대시보드
[program:dashboard]
command=streamlit run scripts/dashboard_realtime.py --server.port=8501 --server.address=0.0.0.0
directory=/app
user=trading
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/dashboard.log
environment=PYTHONPATH="/app"

# 메인 트레이딩 엔진 (운영모드에서만)
[program:trading-engine]
command=python -m src.trading.realtime_engine
directory=/app
user=trading
autostart=%(ENV_TRADING_ENABLED)s
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/trading-engine.log
environment=PYTHONPATH="/app"

# 성능 메트릭 수집기
[program:metrics-collector]
command=python scripts/metrics_collector.py
directory=/app
user=trading
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/metrics.log
environment=PYTHONPATH="/app"

# 일일 리포트 스케줄러
[program:daily-reporter]
command=python scripts/daily_scheduler.py
directory=/app
user=trading
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/scheduler.log
environment=PYTHONPATH="/app"

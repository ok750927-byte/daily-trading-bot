
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 자동매매 일일 보고서</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .date {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 40px;
        }
        h2 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 1.5em;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #ecf0f1;
            color: #34495e;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .info {
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
            background-color: #ecf8ff;
            border: 1px solid #bde0fe;
            padding: 15px;
            border-radius: 5px;
        }
        .no-recommendation {
            margin-top: 20px;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border: 1px dashed #ccc;
            border-radius: 5px;
        }
        .no-recommendation p {
            margin: 0;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>주식 자동매매 일일 보고서</h1>
        <p class="date">예측 기준일: 2025-10-29</p>

        <h2>AI 추천 종목</h2>
        <div class="no-recommendation">
            <p>금일 AI 모델의 추천 종목이 없습니다.</p>
            <p class="info">* 시장 상황을 관망하거나 보수적인 접근이 필요할 수 있습니다.</p>
        </div>

    </div>
</body>
</html>

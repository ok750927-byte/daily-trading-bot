name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pre-commit hooks (includes detect-secrets)
        uses: pre-commit/action@v4
        with:
          extra_args: --all-files

      - name: Run detect-secrets scan (baseline-aware)
        run: |
          python -m pip install detect-secrets
          if [ -f .secrets.baseline ]; then
            detect-secrets scan --baseline .secrets.baseline --all-files
          else
            detect-secrets scan --all-files
          fi

      - name: Prepare Xvfb (for GUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run pytest
        run: |
          python -m pip install pytest
          xvfb-run -s "-screen 0 1920x1080x24" pytest -q
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Xvfb)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Run tests (produce junit xml and log)
        run: |
          pytest -q --junitxml=pytest_full_run.xml |& tee pytest_full_run.log || true

      - name: Upload pytest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            pytest_full_run.xml
            pytest_full_run.log

      - name: Run GUI test under Xvfb (single test)
        run: |
          xvfb-run -s "-screen 0 1280x720x24" pytest -q tests/test_gui_automation_pytestqt.py::test_gui_pipeline_runs_and_creates_report |& tee gui_test.log || true

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-artifacts
          path: |
            gui_test.log

  windows-build:
    name: Windows Test & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pyinstaller
      - name: Run tests
        run: |
          python -m pytest -q --junitxml=pytest_windows.xml |& tee pytest_windows.log || true
      - name: Upload windows pytest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows-artifacts
          path: |
            pytest_windows.xml
            pytest_windows.log
      - name: Build exe (PyInstaller)
        run: |
          python -m PyInstaller --onefile run_gui.py --name daily_trading_gui --distpath dist_release --noconfirm --console
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily_trading_gui
          path: dist_release/daily_trading_gui.exe
